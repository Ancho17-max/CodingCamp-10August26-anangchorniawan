<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Productivity Dashboard</title>

    <style>

        /* =====================================================
           RESET
        ===================================================== */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        /* =====================================================
           BODY
        ===================================================== */

        body {

            min-height: 100vh;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #687ee8,
                    #7645a7
                );

            padding: 22px;

            color: #333;
        }


        /* =====================================================
           DASHBOARD CONTAINER
        ===================================================== */

        .dashboard {

            width: 100%;

            max-width: 1120px;

            margin: 0 auto;
        }


        /* =====================================================
           CARD
        ===================================================== */

        .card {

            background: #ffffff;

            border-radius: 7px;

            box-shadow:
                0 3px 12px rgba(0, 0, 0, 0.08);
        }


        /* =====================================================
           HEADER
        ===================================================== */

        .header {

            text-align: center;

            padding: 20px;

            margin-bottom: 10px;
        }


        .clock {

            color: #7185df;

            font-size: 26px;

            font-weight: 400;

            line-height: 1.2;
        }


        .date {

            margin-top: 4px;

            color: #777;

            font-size: 11px;
        }


        .greeting {

            margin-top: 7px;

            color: #333;

            font-size: 16px;

            font-weight: bold;
        }


        /* =====================================================
           MAIN GRID
        ===================================================== */

        .main-grid {

            display: grid;

            grid-template-columns:
                1fr
                1fr;

            gap: 10px;
        }


        /* =====================================================
           FOCUS TIMER
        ===================================================== */

        .timer-card {

            min-height: 190px;

            padding: 16px;

            text-align: center;
        }


        .section-title {

            font-size: 13px;

            font-weight: bold;

            color: #333;

            margin-bottom: 9px;
        }


        .timer-display {

            color: #7185df;

            font-size: 30px;

            font-weight: 400;

            margin-bottom: 10px;
        }


        .timer-buttons {

            display: flex;

            justify-content: center;

            align-items: center;

            gap: 7px;
        }


        button {

            border: none;

            cursor: pointer;

            font-family: inherit;
        }


        .timer-button {

            padding: 6px 11px;

            border-radius: 3px;

            font-size: 10px;
        }


        .start-button {

            background: #7185df;

            color: white;
        }


        .stop-button,
        .reset-button {

            background: #e7e8ec;

            color: #555;
        }


        .timer-button:hover {

            opacity: 0.85;
        }


        /* =====================================================
           TASKS
        ===================================================== */

        .tasks-card {

            min-height: 190px;

            padding: 16px;
        }


        .task-form {

            display: flex;

            gap: 5px;

            margin-bottom: 9px;
        }


        .task-input {

            flex: 1;

            min-width: 0;

            height: 26px;

            border: 1px solid #8b9aed;

            border-radius: 3px;

            padding: 5px 7px;

            font-size: 10px;

            outline: none;
        }


        .task-input:focus {

            border-color: #667eea;
        }


        .add-task-button {

            height: 26px;

            padding: 0 10px;

            background: #7185df;

            color: white;

            border-radius: 3px;

            font-size: 10px;
        }


        .task-list {

            list-style: none;
        }


        .task-item {

            display: flex;

            align-items: center;

            gap: 5px;

            min-height: 25px;

            border-bottom: 1px solid #f1f1f1;

            font-size: 10px;
        }


        .task-checkbox {

            width: 12px;

            height: 12px;

            cursor: pointer;
        }


        .task-text {

            flex: 1;

            color: #555;
        }


        .task-text.completed {

            color: #aaa;

            text-decoration: line-through;
        }


        .delete-task-button {

            background: #e3686c;

            color: white;

            border-radius: 3px;

            padding: 4px 7px;

            font-size: 8px;
        }


        .empty-task {

            color: #aaa;

            font-size: 10px;

            padding-top: 5px;
        }


        /* =====================================================
           QUICK LINKS
        ===================================================== */

        .quick-links-card {

            width: 49.5%;

            padding: 15px;

            margin-top: 0;
        }


        .quick-form {

            display: grid;

            grid-template-columns:
                1fr
                1fr
                auto;

            gap: 5px;

            margin-bottom: 9px;
        }


        .quick-input {

            height: 26px;

            border: 1px solid #e5e5e5;

            border-radius: 3px;

            padding: 5px 7px;

            font-size: 10px;

            outline: none;
        }


        .quick-input:focus {

            border-color: #7185df;
        }


        .add-link-button {

            height: 26px;

            padding: 0 10px;

            border-radius: 3px;

            background: #7185df;

            color: white;

            font-size: 9px;
        }


        .quick-list {

            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 6px;
        }


        .quick-link {

            position: relative;

            display: flex;

            align-items: center;

            justify-content: center;

            min-height: 27px;

            background: #7185df;

            color: white;

            text-decoration: none;

            border-radius: 4px;

            font-size: 10px;

            padding: 5px 22px 5px 5px;

            overflow: hidden;
        }


        .quick-link:hover {

            background: #5f72d2;
        }


        .remove-link {

            position: absolute;

            right: 4px;

            top: 50%;

            transform: translateY(-50%);

            width: 14px;

            height: 14px;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 50%;

            background: rgba(0, 0, 0, 0.22);

            color: white;

            font-size: 9px;
        }


        /* =====================================================
           RESPONSIVE
        ===================================================== */

        @media (max-width: 700px) {

            body {

                padding: 12px;
            }


            .main-grid {

                grid-template-columns: 1fr;
            }


            .quick-links-card {

                width: 100%;
            }


            .quick-form {

                grid-template-columns: 1fr;
            }


            .quick-list {

                grid-template-columns: 1fr;
            }


            .task-form {

                flex-direction: column;
            }


            .task-input {

                height: 32px;
            }


            .add-task-button {

                height: 32px;
            }
        }


    </style>

</head>


<body>


    <main class="dashboard">


        <!-- =================================================
             BAGIAN A - HEADER
        ================================================== -->

        <section class="card header">

            <div
                id="clock"
                class="clock"
            >
                00:00:00
            </div>


            <div
                id="date"
                class="date"
            >
                Loading...
            </div>


            <div
                id="greeting"
                class="greeting"
            >
                Good Morning
            </div>

        </section>



        <!-- =================================================
             BAGIAN B DAN C
        ================================================== -->

        <section class="main-grid">


            <!-- =============================================
                 BAGIAN B - FOCUS TIMER
            ============================================== -->

            <div class="card timer-card">

                <div class="section-title">
                    Focus Timer
                </div>


                <div
                    id="timerDisplay"
                    class="timer-display"
                >
                    25:00
                </div>


                <div class="timer-buttons">

                    <button
                        id="startTimer"
                        class="timer-button start-button"
                    >
                        Start
                    </button>


                    <button
                        id="stopTimer"
                        class="timer-button stop-button"
                    >
                        Stop
                    </button>


                    <button
                        id="resetTimer"
                        class="timer-button reset-button"
                    >
                        Reset
                    </button>

                </div>

            </div>



            <!-- =============================================
                 BAGIAN C - TASKS
            ============================================== -->

            <div class="card tasks-card">

                <div class="section-title">
                    Tasks
                </div>


                <form
                    id="taskForm"
                    class="task-form"
                >

                    <input
                        id="taskInput"
                        class="task-input"
                        type="text"
                        placeholder="Add a new task..."
                        autocomplete="off"
                    >


                    <button
                        type="submit"
                        class="add-task-button"
                    >
                        Add
                    </button>

                </form>


                <ul
                    id="taskList"
                    class="task-list"
                ></ul>

            </div>



            <!-- =============================================
                 BAGIAN D - QUICK LINKS
            ============================================== -->

            <div class="card quick-links-card">

                <div class="section-title">
                    Quick Links
                </div>


                <form
                    id="quickForm"
                    class="quick-form"
                >

                    <input
                        id="linkName"
                        class="quick-input"
                        type="text"
                        placeholder="Link name"
                        autocomplete="off"
                    >


                    <input
                        id="linkUrl"
                        class="quick-input"
                        type="text"
                        placeholder="URL"
                        autocomplete="off"
                    >


                    <button
                        type="submit"
                        class="add-link-button"
                    >
                        Add Link
                    </button>

                </form>


                <div
                    id="quickList"
                    class="quick-list"
                ></div>

            </div>


        </section>

    </main>



    <script>

        /* =====================================================
           BAGIAN 1
           JAM, TANGGAL DAN GREETING
        ===================================================== */

        function updateDateTime() {

            const now = new Date();


            const hours =
                String(now.getHours())
                .padStart(2, "0");


            const minutes =
                String(now.getMinutes())
                .padStart(2, "0");


            const seconds =
                String(now.getSeconds())
                .padStart(2, "0");


            document.getElementById("clock")
                .textContent =
                `${hours}:${minutes}:${seconds}`;


            const dateText =
                now.toLocaleDateString(
                    "en-US",
                    {
                        weekday: "long",
                        month: "long",
                        day: "numeric",
                        year: "numeric"
                    }
                );


            document.getElementById("date")
                .textContent =
                dateText;


            const hour =
                now.getHours();


            let greeting;


            if (hour < 12) {

                greeting = "Sugeng Enjing";

            }
            else if (hour < 18) {

                greeting = "Sugeng Siang";

            }
            else {

                greeting = "Sugeng Dalu";

            }


            document.getElementById("greeting")
                .textContent =
                greeting;
        }


        updateDateTime();


        setInterval(
            updateDateTime,
            1000
        );



        /* =====================================================
           BAGIAN 2
           FOCUS TIMER
        ===================================================== */

        const POMODORO_TIME =
            50 * 60;


        let timerSeconds =
            POMODORO_TIME;


        let timerInterval =
            null;



        function updateTimerDisplay() {

            const minutes =
                Math.floor(
                    timerSeconds / 60
                );


            const seconds =
                timerSeconds % 60;


            document.getElementById(
                "timerDisplay"
            ).textContent =

                `${String(minutes).padStart(2, "0")}:` +
                `${String(seconds).padStart(2, "0")}`;
        }



        function startTimer() {

            if (timerInterval !== null) {

                return;
            }


            timerInterval =
                setInterval(
                    function() {

                        if (timerSeconds > 0) {

                            timerSeconds--;

                            updateTimerDisplay();

                        }
                        else {

                            stopTimer();

                            alert(
                                "Focus session selesai!"
                            );
                        }

                    },
                    1000
                );
        }



        function stopTimer() {

            clearInterval(
                timerInterval
            );

            timerInterval =
                null;
        }



        function resetTimer() {

            stopTimer();

            timerSeconds =
                DEFAULT_TIME;

            updateTimerDisplay();
        }



        document
            .getElementById("startTimer")
            .addEventListener(
                "click",
                startTimer
            );


        document
            .getElementById("stopTimer")
            .addEventListener(
                "click",
                stopTimer
            );


        document
            .getElementById("resetTimer")
            .addEventListener(
                "click",
                resetTimer
            );


        updateTimerDisplay();



        /* =====================================================
           BAGIAN 3
           TASK MANAGEMENT
        ===================================================== */

        let tasks =
            JSON.parse(
                localStorage.getItem(
                    "productivityTasks"
                )
            ) || [];



        function saveTasks() {

            localStorage.setItem(
                "productivityTasks",
                JSON.stringify(tasks)
            );
        }



        function renderTasks() {

            const taskList =
                document.getElementById(
                    "taskList"
                );


            taskList.innerHTML = "";


            if (tasks.length === 0) {

                const empty =
                    document.createElement(
                        "li"
                    );


                empty.className =
                    "empty-task";


                empty.textContent =
                    "Belum ada task.";


                taskList.appendChild(
                    empty
                );


                return;
            }


            tasks.forEach(
                function(task, index) {

                    const item =
                        document.createElement(
                            "li"
                        );


                    item.className =
                        "task-item";


                    const checkbox =
                        document.createElement(
                            "input"
                        );


                    checkbox.type =
                        "checkbox";


                    checkbox.className =
                        "task-checkbox";


                    checkbox.checked =
                        task.completed;


                    checkbox.addEventListener(
                        "change",
                        function() {

                            tasks[index]
                                .completed =
                                checkbox.checked;


                            saveTasks();

                            renderTasks();
                        }
                    );


                    const text =
                        document.createElement(
                            "span"
                        );


                    text.className =
                        "task-text";


                    text.textContent =
                        task.text;


                    if (task.completed) {

                        text.classList.add(
                            "completed"
                        );
                    }


                    const deleteButton =
                        document.createElement(
                            "button"
                        );


                    deleteButton.type =
                        "button";


                    deleteButton.className =
                        "delete-task-button";


                    deleteButton.textContent =
                        "Delete";


                    deleteButton.addEventListener(
                        "click",
                        function() {

                            tasks.splice(
                                index,
                                1
                            );


                            saveTasks();

                            renderTasks();
                        }
                    );


                    item.appendChild(
                        checkbox
                    );


                    item.appendChild(
                        text
                    );


                    item.appendChild(
                        deleteButton
                    );


                    taskList.appendChild(
                        item
                    );

                }
            );
        }



        document
            .getElementById("taskForm")
            .addEventListener(
                "submit",
                function(event) {

                    event.preventDefault();


                    const input =
                        document.getElementById(
                            "taskInput"
                        );


                    const text =
                        input.value.trim();


                    if (text === "") {

                        return;
                    }


                    tasks.push({

                        text: text,

                        completed: false

                    });


                    saveTasks();

                    renderTasks();


                    input.value = "";

                    input.focus();

                }
            );


        renderTasks();



        /* =====================================================
           BAGIAN 4
           QUICK LINKS
        ===================================================== */

        const defaultLinks = [

            {
                name: "Google",
                url: "https://www.google.com"
            },

            {
                name: "Gmail",
                url: "https://mail.google.com"
            },

            {
                name: "Calendar",
                url: "https://calendar.google.com"
            }

        ];



        let links =
            JSON.parse(
                localStorage.getItem(
                    "productivityLinks"
                )
            );


        if (!links) {

            links =
                defaultLinks;

            localStorage.setItem(
                "productivityLinks",
                JSON.stringify(links)
            );
        }



        function saveLinks() {

            localStorage.setItem(
                "productivityLinks",
                JSON.stringify(links)
            );
        }



        function normalizeUrl(url) {

            if (
                !url.startsWith(
                    "http://"
                ) &&
                !url.startsWith(
                    "https://"
                )
            ) {

                return "https://" + url;
            }


            return url;
        }



        function renderLinks() {

            const quickList =
                document.getElementById(
                    "quickList"
                );


            quickList.innerHTML = "";


            links.forEach(
                function(link, index) {

                    const anchor =
                        document.createElement(
                            "a"
                        );


                    anchor.className =
                        "quick-link";


                    anchor.href =
                        link.url;


                    anchor.target =
                        "_blank";


                    anchor.rel =
                        "noopener noreferrer";


                    anchor.textContent =
                        link.name;


                    const removeButton =
                        document.createElement(
                            "button"
                        );


                    removeButton.type =
                        "button";


                    removeButton.className =
                        "remove-link";


                    removeButton.textContent =
                        "×";


                    removeButton.title =
                        "Hapus link";


                    removeButton.addEventListener(
                        "click",
                        function(event) {

                            event.preventDefault();

                            event.stopPropagation();


                            links.splice(
                                index,
                                1
                            );


                            saveLinks();

                            renderLinks();
                        }
                    );


                    anchor.appendChild(
                        removeButton
                    );


                    quickList.appendChild(
                        anchor
                    );

                }
            );
        }



        document
            .getElementById("quickForm")
            .addEventListener(
                "submit",
                function(event) {

                    event.preventDefault();


                    const nameInput =
                        document.getElementById(
                            "linkName"
                        );


                    const urlInput =
                        document.getElementById(
                            "linkUrl"
                        );


                    const name =
                        nameInput.value.trim();


                    const url =
                        urlInput.value.trim();


                    if (
                        name === "" ||
                        url === ""
                    ) {

                        alert(
                            "Nama dan URL harus diisi."
                        );

                        return;
                    }


                    links.push({

                        name: name,

                        url: normalizeUrl(url)

                    });


                    saveLinks();

                    renderLinks();


                    nameInput.value = "";

                    urlInput.value = "";

                    nameInput.focus();

                }
            );


        renderLinks();

    </script>

</body>

</html>
